<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    background: linear-gradient(135deg, #eef2f7 0%, #e4ecf5 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
    color: #2c3e50;
  }

  .container { width: 100%; max-width: 760px; }

  .header { text-align: center; margin-bottom: 36px; }
  .header h1 { font-size: 30px; font-weight: 700; color: #1a3a5c; letter-spacing: 2px; }
  .header p { margin-top: 10px; font-size: 14px; color: #7a8ba0; }

  .search-box {
    background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 4px 24px rgba(30, 60, 100, 0.08); margin-bottom: 28px;
  }
  .search-row { display: flex; gap: 12px; }
  .search-row input {
    flex: 1; border: 2px solid #dce4ee; border-radius: 10px;
    padding: 13px 16px; font-size: 16px; outline: none; transition: border-color 0.2s;
  }
  .search-row input:focus { border-color: #4a90d9; }
  .search-row button {
    background: #3b7dc4; color: #fff; border: none; border-radius: 10px;
    padding: 0 30px; font-size: 16px; cursor: pointer; transition: background 0.2s;
  }
  .search-row button:hover { background: #2f66a5; }
  .hint { margin-top: 12px; font-size: 13px; color: #9aa9bc; }

  .message { text-align: center; padding: 32px 20px; border-radius: 16px; font-size: 15px; display: none; }
  .message.error { background: #fdeeee; color: #c0392b; display: block; }
  .message.info  { background: #eef4fb; color: #5a7ca6; display: block; }

  .result-card {
    background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(30, 60, 100, 0.08); display: none;
  }
  .result-header { background: linear-gradient(135deg, #3b7dc4, #5a9bd8); color: #fff; padding: 22px 28px; }
  .result-header .name { font-size: 24px; font-weight: 700; }
  .result-header .meta { margin-top: 6px; font-size: 14px; opacity: 0.92; line-height: 1.5; }

  .result-body { padding: 24px 28px 28px; }

  .section-title {
    font-size: 15px; font-weight: 600; color: #5a7ca6; margin: 20px 0 10px;
    padding-left: 10px; border-left: 4px solid #4a90d9;
  }
  .section-title:first-child { margin-top: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid #eef1f6; }
  th { background: #f4f7fb; color: #5a6c80; font-weight: 600; font-size: 13.5px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafd; }

  td.label { color: #6b7c92; width: 58%; }
  td.value { font-weight: 600; color: #2c3e50; }

  .score-good { color: #27ae60; font-weight: 700; }
  .score-mid  { color: #e67e22; font-weight: 700; }

  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .info-item { background: #f6f9fc; border-radius: 10px; padding: 12px 16px; }
  .info-item .label { font-size: 12.5px; color: #8a99ac; margin-bottom: 4px; }
  .info-item .value { font-size: 15px; font-weight: 600; color: #2c3e50; word-break: break-all; }

  .count-tip { margin-top: 14px; font-size: 13px; color: #9aa9bc; text-align: right; }
  .footer { margin-top: 40px; font-size: 12.5px; color: #a5b3c4; text-align: center; }

  @media (max-width: 520px) {
    .search-row { flex-direction: column; }
    .search-row button { padding: 13px; }
    .result-header, .result-body { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>

<div class="container">

  </div>

  </div>

</div>

/* ---------------- 以下为查询逻辑，一般无需修改 ---------------- */

const input = document.getElementById("searchInput");
const messageEl = document.getElementById("message");
const card = document.getElementById("resultCard");

input.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

function doSearch() {
  const q = input.value.trim();
  hideAll();

  if (!q) {
    showMessage("请输入姓名或学号后再查询", "info");
    return;
  }

  // 只允许完整姓名或完整学号精确匹配，防止通过输入部分信息窥探他人成绩
  const matches = STUDENT_DATA.filter(s => s.name === q || s.id === q);

  if (matches.length === 0) {
    showMessage("未找到「" + q + "」的记录，请检查姓名或学号是否输入正确", "error");
    return;
  }
  if (matches.length === 1) {
    render(matches[0]);
    return;
  }

  showMessage(
    "找到 " + matches.length + " 位同名同学，请点击查看：" +
    matches.map(s =>
      '<button onclick="renderByIndex(' + STUDENT_DATA.indexOf(s) + ')" style="margin:6px 6px 0;padding:6px 14px;border:1px solid #b9cbe0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;">' +
      s.name + "（学号 " + s.id + "）</button>"
    ).join(""),
    "info"
  );
}

function renderByIndex(i) { render(STUDENT_DATA[i]); }

function metricClass(label, raw) {
  const v = parseFloat(raw);
  if (isNaN(v) || label.indexOf("排名") >= 0) return "";
  const isGpa = label.indexOf("绩点") >= 0;
  const good = isGpa ? v >= 3.8 : v >= 90;
  const mid  = isGpa ? v >= 3.5 : v >= 85;
  if (good) return "score-good";
  if (mid)  return "score-mid";
  return "";
}

function render(s) {
  hideAll();
  card.style.display = "block";

  document.getElementById("rName").textContent = s.name;
  document.getElementById("rMeta").textContent =
    [s.id ? "学号 " + s.id : "", s.dept, s.major].filter(Boolean).join(" · ");

  // 基本信息：学号 / 院系 / 专业
  const basicPairs = [[META.basic[0], s.id], [META.basic[2], s.dept], [META.basic[3], s.major]];
  document.getElementById("rBasic").innerHTML = basicPairs
    .filter(([k, v]) => v)
    .map(([k, v]) => '<div class="info-item"><div class="label">' + k + '</div><div class="value">' + v + '</div></div>')
    .join("");

  // 明细：表格中除基本信息外的全部字段，逐行完整展示
  document.getElementById("rMetricBody").innerHTML = (s.metrics || []).map(([k, v]) =>
    '<tr><td class="label">' + k + '</td><td class="value ' + metricClass(k, v) + '">' + (v === "" ? "—" : v) + '</td></tr>'
  ).join("");

  document.getElementById("rCountTip").textContent =
    "共 " + META.metric.length + " 项指标 · 数据来源：学位课绩点排名表";

  card.scrollIntoView({ behavior: "smooth", block: "start" });
}

function showMessage(html, type) { messageEl.className = "message " + type; messageEl.innerHTML = html; }
function hideAll() { messageEl.className = "message"; messageEl.innerHTML = ""; card.style.display = "none"; }
</script>
